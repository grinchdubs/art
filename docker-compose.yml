name: art-catalog-prod

services:
  db:
    image: postgres:15-alpine
    container_name: art-catalog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: artcatalog
      POSTGRES_PASSWORD: artcatalog123
      POSTGRES_DB: artcatalog
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5434:5432"  # grnchai: 5432 is used by Nextcloud's postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artcatalog"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: art-catalog-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://artcatalog:artcatalog123@db:5432/artcatalog
      - PORT=3002
    ports:
      - "3002:3002"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: art-catalog-frontend
    ports:
      - "3333:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - VITE_API_URL=
    depends_on:
      - backend

volumes:
  postgres_data:
    # Explicit name so the volume survives the compose project being renamed.
    name: art-catalog_postgres_data
